name: Build iOS IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build (arm64, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project YunX.xcodeproj \
            -scheme YunX \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO \
            build | tee build.log
          echo "---- tail ----"
          tail -n 40 build.log

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/YunX.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle not found at $APP_PATH"
            find build/Build/Products -maxdepth 3 -name "*.app" || true
            exit 1
          fi
          mkdir -p out/Payload
          cp -R "$APP_PATH" out/Payload/
          # 打进 entitlements 之外的必要文件：确保可执行位存在
          chmod +x "out/Payload/YunX.app/YunX"
          cd out
          zip -qry "../YunX-unsigned.ipa" Payload
          cd ..
          ls -lh YunX-unsigned.ipa
          unzip -l YunX-unsigned.ipa | head -n 20

      - name: Extract dSYM info
        if: always()
        run: |
          find build/Build/Products -name "*.dSYM" -maxdepth 3 || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YunX-unsigned-ipa
          path: YunX-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: YunX-unsigned.ipa
          generate_release_notes: true
